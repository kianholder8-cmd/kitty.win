<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | kitty.win</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f1ede2">
<meta name="description" content="Create your kitty.win account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f1ede2'/%3E%3Cg fill='%2316140f'%3E%3Crect x='2' y='3' width='2' height='4'/%3E%3Crect x='12' y='3' width='2' height='4'/%3E%3Crect x='2' y='6' width='12' height='8'/%3E%3C/g%3E%3Cg fill='%23f1ede2'%3E%3Crect x='5' y='9' width='2' height='2'/%3E%3Crect x='9' y='9' width='2' height='2'/%3E%3Crect x='7' y='12' width='2' height='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">

  <header class="brand">
    <svg class="mark" width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="2" y="3" width="2" height="4" fill="currentColor"></rect>
      <rect x="12" y="3" width="2" height="4" fill="currentColor"></rect>
      <rect x="2" y="6" width="12" height="8" fill="currentColor"></rect>
      <rect class="eye" x="5" y="9" width="2" height="2"></rect>
      <rect class="eye" x="9" y="9" width="2" height="2"></rect>
      <rect class="eye" x="7" y="12" width="2" height="1"></rect>
    </svg>
    <span class="wordmark">kitty.win</span>
  </header>

  <main class="card">
    <p class="eyebrow" id="eyebrow">Sign up</p>
    <h1 id="heading">Create your account</h1>
    <p class="sub" id="sub">One account for kitty.win. Takes about a minute.</p>

    <a class="btn google" id="google" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"></path>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"></path>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"></path>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"></path>
      </svg>
      <span>Continue with Google</span>
    </a>

    <div class="divider"><span>or use email</span></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
      </div>

      <p class="error" id="error" role="alert" hidden></p>

      <button class="btn primary" id="submit" type="submit">Create account</button>
    </form>

    <p class="switch" id="switch">Already have an account? <a href="/signin">Sign in</a></p>
  </main>

</div>
<script src="/auth.js" defer></script>
</body>
</html>
